<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screening Results</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f7fb;
            margin: 0;
            padding: 30px 20px;
            color: #1f2937;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            padding: 28px;
        }
        h1 {
            color: #0f172a;
            margin-top: 0;
        }
        .chart-box {
            margin: 30px 0;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 18px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            overflow: hidden;
            border-radius: 12px;
        }
        th, td {
            border: 1px solid #e2e8f0;
            padding: 12px 10px;
            text-align: left;
            vertical-align: top;
        }
        th {
            background: #dbeafe;
            color: #1e3a8a;
        }
        tr:nth-child(even) {
            background: #f8fafc;
        }
        .actions {
            margin-top: 20px;
        }
        .button-link {
            display: inline-block;
            text-decoration: none;
            background: #2563eb;
            color: white;
            border-radius: 10px;
            padding: 10px 18px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ranked Resume Results</h1>

        <div class="chart-box">
            <canvas id="scoreChart" height="120"></canvas>
        </div>

        <table th:if="${not #lists.isEmpty(results)}">
            <thead>
            <tr>
                <th>Rank</th>
                <th>Resume Name</th>
                <th>Score</th>
                <th>Skill Match %</th>
                <th>Matched Skills</th>
                <th>Missing Skills</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="result, iterStat : ${results}">
                <td th:text="${iterStat.index + 1}">1</td>
                <td th:text="${result.name()}">resume.txt</td>
                <td th:text="${#numbers.formatDecimal(result.score(), 0, 2) + '%'}">82.45%</td>
                <td th:text="${#numbers.formatDecimal(result.skillMatchPercent(), 0, 2) + '%'}">85.71%</td>
                <td th:text="${#strings.listJoin(result.matchedSkills(), ', ')}">Java, SQL</td>
                <td th:text="${#strings.listJoin(result.missingSkills(), ', ')}">C, R</td>
            </tr>
            </tbody>
        </table>

        <div class="actions">
            <a class="button-link" th:href="@{/}">Back to Home</a>
        </div>
    </div>

    <script th:inline="javascript">
        const labels = /*[[${chartLabels}]]*/ [];
        const scores = /*[[${chartScores}]]*/ [];

        const ctx = document.getElementById('scoreChart');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Resume Score (%)',
                    data: scores,
                    backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#14b8a6'],
                    borderRadius: 6
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 100,
                        title: {
                            display: true,
                            text: 'Score'
                        }
                    },
                    x: {
                        title: {
                            display: true,
                            text: 'Resume Name'
                        }
                    }
                },
                plugins: {
                    legend: {
                        display: false
                    }
                }
            }
        });
    </script>
</body>
</html>
